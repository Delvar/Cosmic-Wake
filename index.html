<!DOCTYPE html>
<html>

<head>
    <title>Cosmic Wake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <style>
        /* =========================== */
        /*  COLOUR PALETTE             */
        /* =========================== */

        :root {
            /* 1970s muted colours */
            --colour-red: #E57373;
            --colour-red-orange: #ECA682;
            --colour-orange: #F4A261;
            --colour-orange-yellow: #EAB13B;
            --colour-yellow: #E2B13C;
            --colour-yellow-green: #B6D462;
            --colour-green: #66CC66;
            --colour-green-blue: #6699CC;
            --colour-blue: #4C66E6;
            --colour-blue-purple: #8066E6;
            --colour-purple: #B266E6;
            --colour-purple-red: #CB749F;

            /* Light variants */
            --colour-red-light: #F69696;
            --colour-red-orange-light: #FCA586;
            --colour-orange-light: #FDB47D;
            --colour-orange-yellow-light: #F4C04E;
            --colour-yellow-light: #F0C04E;
            --colour-yellow-green-light: #CCDE75;
            --colour-green-light: #78E278;
            --colour-green-blue-light: #78B4E2;
            --colour-blue-light: #637EF6;
            --colour-blue-purple-light: #9678F6;
            --colour-purple-light: #C378F6;
            --colour-purple-red-light: #D89CB7;

            /* Dark variants */
            --colour-red-dark: #C05151;
            --colour-red-orange-dark: #C6634B;
            --colour-orange-dark: #CC7545;
            --colour-orange-yellow-dark: #C57E2A;
            --colour-yellow-dark: #C07E2A;
            --colour-yellow-green-dark: #8A9C48;
            --colour-green-dark: #489348;
            --colour-green-blue-dark: #486F93;
            --colour-blue-dark: #3648A2;
            --colour-blue-purple-dark: #5A48A2;
            --colour-purple-dark: #7F48A2;
            --colour-purple-red-dark: #90637A;

            /* Neutrals */
            --colour-white: #F5ECDF;
            --colour-grey: #9E968B;
            --colour-black: #403C38;

            --colour-white-light: #FAF3EB;
            --colour-grey-light: #C0B8AD;
            --colour-black-light: #635E57;

            --colour-white-dark: #D6CFC4;
            --colour-grey-dark: #7C756B;
            --colour-black-dark: #2A2927;
        }

        /* =========================== */
        /*  REUSABLE UI WINDOW SYSTEM  */
        /* =========================== */

        .ui-window {
            --inner-radius: 5px;
            --border-width: 2px;

            --padding-top: 10px;
            --padding-right: 5px;
            --padding-bottom: 5px;
            --padding-left: 5px;

            --padding-border-top: calc(var(--border-width) + var(--padding-top));
            --padding-border-right: calc(var(--border-width) + var(--padding-right));
            --padding-border-bottom: calc(var(--border-width) + var(--padding-bottom));
            --padding-border-left: calc(var(--border-width) + var(--padding-left));

            --layer: 2.0;

            position: absolute;
            cursor: grab;
        }

        .ui-window.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .ui-window.dragging {
            cursor: grabbing;
        }

        /* Layer classes (0 = innermost) */
        .ui-layer {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            border: var(--border-width) solid black;
            padding: var(--padding-top) var(--padding-right) var(--padding-bottom) var(--padding-left);
            transition: background-color 0.25s linear;
            width: min-content;
        }

        .ui-layer-2 {
            background-color: var(--layer-2-bg, red);
            --layer: 2.0;
            border-top-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-left)) * var(--layer));
            border-top-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-right)) * var(--layer));
            border-bottom-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-left)) * var(--layer));
            border-bottom-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-right)) * var(--layer));
        }

        .ui-layer-1 {
            background-color: var(--layer-1-bg, green);
            --layer: 1.0;
            border-top-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-left)) * var(--layer));
            border-top-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-right)) * var(--layer));
            border-bottom-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-left)) * var(--layer));
            border-bottom-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-right)) * var(--layer));
        }

        .ui-layer-0 {
            background-color: var(--layer-0-bg, black);
            --layer: 0.0;
            border-top-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-left)) * var(--layer));
            border-top-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-top), var(--padding-border-right)) * var(--layer));
            border-bottom-left-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-left)) * var(--layer));
            border-bottom-right-radius: calc(var(--inner-radius) + var(--border-width) + max(var(--padding-border-bottom), var(--padding-border-right)) * var(--layer));
            padding: 0px;
        }

        /* Optional title bar */
        .ui-window-title-bar {
            position: absolute;
            top: var(--border-width);
            left: 0;
            display: flex;
        }

        .ui-window-title-left-wing {
            width: calc(20px + (var(--padding-left) + var(--border-width)) * var(--layer) + var(--inner-radius));
            flex-shrink: 0;
        }

        .ui-window-title-text {
            background-color: var(--colour-black-dark);
            padding: 2px 10px;
            color: var(--title-text, turquoise);
            font-size: calc(var(--border-width) + var(--layer) * (var(--padding-top) + var(--border-width)) - 1px);
            font-weight: 900;
            letter-spacing: 2px;
            border-left-width: 4px;
            border-left-style: solid;
            border-left-color: var(--title-border, red);
            border-right-width: 4px;
            border-right-style: solid;
            border-right-color: var(--title-border, red);
            outline: var(--border-width) solid black;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-box: trim-both cap alphabetic;
            transition: background-color 0.25s linear, color 0.25s linear, border-color 0.25s linear;
        }

        .ui-window-title-right-wing {
            width: calc(20px + (var(--padding-right) + var(--border-width)) * var(--layer) + var(--inner-radius));
            flex-shrink: 0;
        }

        .ui-window-content {
            background-color: var(--content-bg, turquoise);
            padding: 10px;
            border-top-left-radius: var(--inner-radius);
            border-top-right-radius: var(--inner-radius);
            border-bottom-left-radius: var(--inner-radius);
            border-bottom-right-radius: var(--inner-radius);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .ui-window-content:not(:first-child) {
            margin-top: var(--border-width);
        }

        .ui-window-content:last-child {
            border-bottom-right-radius: 0px;
        }

        /* =========================== */
        /*  TINT SYSTEM                */
        /* =========================== */

        .tint-allied {
            --layer-2-bg: var(--colour-green);
            --layer-1-bg: var(--colour-green-blue-dark);
            --layer-0-bg: var(--colour-black);
            --content-bg: var(--colour-green-blue-light);
            --title-border: var(--layer-2-bg);
            --title-text: var(--colour-blue-light);
        }

        .tint-neutral {
            --layer-2-bg: var(--colour-blue);
            --layer-1-bg: var(--colour-blue-purple-dark);
            --layer-0-bg: var(--colour-black);
            --content-bg: var(--colour-blue-purple-light);
            --title-border: var(--layer-2-bg);
            --title-text: var(--colour-purple-light);
        }

        .tint-hostile {
            --layer-2-bg: var(--colour-red);
            --layer-1-bg: var(--colour-orange-dark);
            --layer-0-bg: var(--colour-black);
            --content-bg: var(--colour-red-orange-light);
            --title-border: var(--layer-2-bg);
            --title-text: var(--colour-orange-light);
        }

        .tint-disabled {
            --layer-2-bg: var(--colour-grey-dark);
            --layer-1-bg: var(--colour-black);
            --layer-0-bg: var(--colour-black-dark);
            --content-bg: var(--colour-grey);
            --title-border: var(--layer-2-bg);
            --title-text: var(--colour-grey-light);
        }

        /* =========================== */
        /*  RESIZE HANDLES             */
        /* =========================== */

        .resize-handle {
            position: absolute;
            width: calc(2.0 * var(--inner-radius) + var(--border-width));
            height: calc(2.0 * var(--inner-radius) + var(--border-width));
            /* background-color: rgba(64, 224, 208, 0.219); */
            box-sizing: border-box;
            border-color: var(--layer-2-bg);
            z-index: +2;
            transition: border-color 0.25s linear, visibility 0.25s linear, opacity 0.25s ease-in-out;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .ui-window:hover .resize-handle {
            visibility: visible;
            opacity: 1.0;
            pointer-events: unset;
        }

        .ui-window .resize-handle.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            /* display: none; */
        }

        .resize-handle.top-left {
            top: calc(0px - var(--border-width));
            left: calc(0px - var(--border-width));
            cursor: nwse-resize;
            border-width: var(--border-width) 0px 0px var(--border-width);
            border-style: solid none none solid;
            border-top-left-radius: calc(var(--inner-radius) + var(--border-width));
        }

        .resize-handle.top {
            top: calc(0px - var(--border-width));
            left: 50%;
            transform: translateX(-50%);
            cursor: ns-resize;
            border-width: var(--border-width) 0px 0px 0px;
            border-style: solid none none none;
        }

        .resize-handle.top-right {
            top: calc(0px - var(--border-width));
            right: calc(0px - var(--border-width));
            cursor: nesw-resize;
            border-width: var(--border-width) var(--border-width) 0px 0px;
            border-style: solid solid none none;
            border-top-right-radius: calc(var(--inner-radius) + var(--border-width));
        }

        .resize-handle.left {
            left: calc(0px - var(--border-width));
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
            border-width: 0px 0px 0px var(--border-width);
            border-style: none none none solid;
        }

        .resize-handle.right {
            right: calc(0px - var(--border-width));
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
            border-width: 0px var(--border-width) var(--border-width) 0px;
            border-style: none solid none none;
        }

        .resize-handle.bottom-left {
            bottom: calc(0px - var(--border-width));
            left: calc(0px - var(--border-width));
            cursor: nesw-resize;
            border-width: 0px 0px var(--border-width) var(--border-width);
            border-style: none none solid solid;
            border-bottom-left-radius: calc(var(--inner-radius) + var(--border-width));
        }

        .resize-handle.bottom {
            bottom: calc(0px - var(--border-width));
            left: 50%;
            transform: translateX(-50%);
            cursor: ns-resize;
            border-width: 0px 0px var(--border-width) 0px;
            border-style: none none solid none;
        }

        .resize-handle.bottom-right {
            bottom: calc(0px - var(--border-width));
            right: calc(0px - var(--border-width));
            cursor: nwse-resize;
            border-width: 0px var(--border-width) var(--border-width) 0px;
            border-style: none solid solid none;
            border-bottom-right-radius: calc(var(--inner-radius) + var(--border-width));
        }

        /* =========================== */
        /*  WINDOWS                    */
        /* =========================== */

        .ui-window {
            transition: visibility 0.25s linear, opacity 0.25s ease-in-out;
        }

        .ui-window .ui-layer.ui-layer-0 {
            display: grid;
            grid-template-rows: 1fr;
        }

        .ui-window:not(.resizing, .dragging) .ui-layer.ui-layer-0 {
            transition: grid-template-rows 0.25s ease-in-out;
        }

        .ui-window.hidden:not(.resizing, .dragging) .ui-layer.ui-layer-0 {
            grid-template-rows: 0fr;
        }

        .ui-layer-2.ui-glow {
            transition: box-shadow 0.25s linear;
            box-shadow: 0 0 40px color-mix(var(--layer-2-bg, red) 40%, transparent);
        }

        #target-ui canvas {
            box-sizing: border-box;
            border-top-left-radius: var(--inner-radius);
            border-top-right-radius: var(--inner-radius);
            border-bottom-left-radius: var(--inner-radius);
            border-bottom-right-radius: var(--inner-radius);
        }

        #log-ui {
            display: flex;
            flex-direction: row;
            width: fit-content !important;
            height: fit-content !important;
        }

        #log-ui .bar {
            width: var(--padding-border-left);
            background-color: var(--layer-2-bg);
            border-top-left-radius: var(--padding-border-left);
            border-bottom-left-radius: var(--padding-border-left);
            flex-shrink: 0;
            transition: height 100ms ease-out;
            box-shadow: 0 0 calc(2.0 * var(--padding-border-left)) color-mix(var(--layer-2-bg, red) 70%, transparent);
        }

        #log-ui .inner {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            box-sizing: border-box;
            margin-left: var(--padding-border-left);
        }

        #log-ui .log-line {
            color: var(--colour-white-light);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
            height: 22px;
            line-height: 22px;
            display: flex;
        }

        @keyframes pulse {
            0% {
                color: var(--colour-white-light);
            }

            50% {
                color: var(--colour-grey-dark);
            }

            100% {
                color: var(--colour-white-light);
            }
        }

        #log-ui .log-line.in {
            opacity: 1;
            align-items: start;
            transition-property: opacity, height;
            transition-duration: 200ms;
            transition-timing-function: ease-out;
            animation: pulse 200ms 2;

            @starting-style {
                opacity: 0;
                height: 0px;
                margin-top: 0px;
                margin-bottom: 0px;
                padding-top: 0px;
                padding-bottom: 0px;
            }
        }

        #log-ui .log-line.out {
            opacity: 0;
            height: 0px;
            margin-top: 0px;
            margin-bottom: 0px;
            padding-top: 0px;
            padding-bottom: 0px;
            align-items: end;
            transition: all 380ms ease-out;
        }

        /* =========================== */
        /*  Buttons                    */
        /* =========================== */

        #docking-ui button {
            padding: 10px 20px;
            background: var(--colour-red-dark);
            border: none;
            cursor: pointer;
            width: 100%;
            display: flow;
            font-family: "Mulish", "Century Gothic", "CenturyGothic", "AppleGothic", sans-serif;
            color: white;
            font-size: 16px;
            font-weight: 900;
            text-shadow: 1.5px 1.5px 2px black;
            white-space: nowrap;
        }

        #docking-ui button .icon {
            font-weight: normal;
        }

        #docking-ui button.disabled {
            background: var(--colour-grey-dark);
            color: var(--colour-grey);
            cursor: not-allowed;
            opacity: 0.6;
        }

        #docking-ui button.hidden {
            display: none !important;
        }

        /* All visible buttons get top margin */
        #docking-ui button:not(.hidden) {
            margin-top: var(--border-width);
        }

        /* First visible button – no top margin + rounded top */
        #docking-ui button:nth-child(1 of :not(.hidden)) {
            margin-top: 0;
            border-top-left-radius: var(--inner-radius);
            border-top-right-radius: var(--inner-radius);
        }

        /* Last visible button – rounded bottom */
        #docking-ui button:nth-last-child(1 of :not(.hidden)) {
            border-bottom-left-radius: var(--inner-radius);
            border-bottom-right-radius: var(--inner-radius);
        }

        /* =========================== */
        /*  STATS GRID                 */
        /* =========================== */
        @property --row-height {
            syntax: "<length>";
            inherits: true;
            initial-value: 0px;
        }

        .ui-stats-grid {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
        }

        .ui-stats-grid-text-row,
        .ui-stats-grid-label-text-row,
        .ui-stats-grid-bar-row {
            display: contents;
            font-size: var(--row-height);
            height: var(--row-height);
            transition: --row-height 0.1s ease-in-out, visibility 0.1s linear;
        }

        .ui-stats-grid-text-row.hidden,
        .ui-stats-grid-label-text-row.hidden,
        .ui-stats-grid-bar-row.hidden {
            visibility: hidden;
            --row-height: 0px;
        }

        .ui-stats-grid-label-text-row>div:nth-of-type(1),
        .ui-stats-grid-bar-row>div:nth-of-type(1) {
            text-align: right;
        }

        .ui-stats-grid-text-row>div:nth-of-type(1) {
            grid-column: 1 / span 3;
            text-align: center;
        }

        .ui-stats-grid-text-row>div:nth-of-type(1)::after {
            content: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .ui-stats-grid-label-text-row>div:nth-of-type(2) {
            grid-column: 2 / span 2;
        }

        .ui-stats-grid-label-text-row>div:nth-of-type(2)::after {
            content: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* New row type for number + units (mirrors bar-row structure) */
        .ui-stats-grid-number-unit-row {
            display: contents;
            font-size: var(--row-height);
            height: var(--row-height);
            transition: --row-height 0.1s ease-in-out, visibility 0.1s linear;
        }

        .ui-stats-grid-number-unit-row.hidden {
            visibility: hidden;
            --row-height: 0px;
        }

        /* Label (col 1): Right-aligned, like bars */
        .ui-stats-grid-number-unit-row>div:nth-of-type(1) {
            text-align: right;
        }

        /* Number cell (col 2): Fixed width, right-aligned, monospace for alignment */
        .ui-stats-grid-number-unit-row>div:nth-of-type(2) {
            min-width: 5ch;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
            display: block;
        }

        /* Units cell (col 3): Fixed width, left-aligned */
        .ui-stats-grid-number-unit-row>div:nth-of-type(3) {
            min-width: 2ch;
            text-align: left;
            overflow: hidden;
        }

        /* Render distance/value and unit via CSS variables (set from JS) */
        #target-ui_distance>div:nth-of-type(2)::after {
            content: var(--distance-value);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        #target-ui_distance>div:nth-of-type(3)::after {
            content: var(--distance-unit);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Gap between number and units */
        #target-ui .ui-stats-grid {
            column-gap: 0.5ch;
        }

        .ui-stats-grid-bar-row>div:nth-of-type(2) {
            container-type: inline-size;
            width: 100%;
            height: var(--row-height);
            background: var(--bg);
            border-radius: var(--inner-radius);
            overflow: hidden;
            outline: solid rgb(0, 0, 0, 0.25) 1px;

            box-shadow: 0 0 var(--row-height) color-mix(var(--bg, red) 40%, transparent);

            @property --percent {
                syntax: "<number>";
                inherits: true;
                initial-value: 0;
            }

            --layer:0;
            --segment-width: var(--row-height);
            --gap: 5px;
            --segment-step: calc(var(--segment-width) + var(--gap));
            --segment-step-pct: calc((var(--segment-width) + var(--gap)) / 100cqi * 100%);
        }

        .ui-stats-grid-bar-row>div:nth-of-type(3) {
            text-align: right;
            min-width: 4.5ch;
        }

        .ui-stats-grid-bar-row>div:nth-of-type(3)::after {
            counter-reset: progress-counter var(--percent);
            content: counter(progress-counter) '%';
        }

        .ui-stats-grid-bar-bar {
            height: 100%;
            background: var(--color);
            width: calc(round(var(--percent) * 1%, var(--segment-step-pct)));
            /* Segment mask */
            mask-image: repeating-linear-gradient(to right,
                    #000 0,
                    #000 var(--segment-width),
                    transparent var(--segment-width),
                    transparent calc(var(--segment-width) + var(--gap)));
            mask-size: calc(var(--segment-width) + var(--gap)) 100%;
            /* Shadow will not show due to parent overflow: hidden :(*/
            /* box-shadow: 0 0 var(--row-height) color-mix(var(--color, red) 90%, transparent); */
        }

        .ui-window:not(.resizing, .dragging):not(.resizing, .dragging) .ui-stats-grid-bar-bar {
            transition: width 250ms ease-in-out;
        }

        /* Rapid recharge pulse – left-to-right shine on shield only */
        .ui-stats-grid-bar-row.pulse .ui-stats-grid-bar-bar {
            animation: shield-recharge-pulse 2s linear infinite;
            background: linear-gradient(90deg,
                    var(--color) 0%,
                    var(--color) 40%,
                    var(--charge-colour) 45%,
                    var(--charge-colour) 55%,
                    var(--color) 60%,
                    var(--color) 100%);
            background-size: 300% 100%;
        }

        @keyframes shield-recharge-pulse {
            0% {
                background-position-x: 300%;
            }

            100% {
                background-position-x: 0%;
            }
        }

        #target-ui .ui-stats-grid {
            --row-height: 12px;
            column-gap: 8px;
            row-gap: 1px;
            text-shadow: none;
        }

        #stats-ui .ui-stats-grid {
            --row-height: 18px;
            column-gap: 10px;
            row-gap: 6px;
        }

        #stats-ui_hull {
            --color: var(--colour-green);
            --bg: var(--colour-green-dark);
            --charge-colour: var(--colour-yellow-green-light);
        }

        #stats-ui_shield {
            --color: var(--colour-blue);
            --bg: var(--colour-blue-dark);
            --charge-colour: var(--colour-green-blue-light);
        }

        #target-ui_hull {
            --color: var(--colour-green);
            --bg: var(--colour-green-dark);
            --charge-colour: var(--colour-yellow-green-light);
        }

        #target-ui_shield {
            --color: var(--colour-blue);
            --bg: var(--colour-blue-dark);
            --charge-colour: var(--colour-green-blue-light);

        }

        #stats-ui_cargo {
            --color: var(--colour-orange);
            --bg: var(--colour-orange-dark);
            --charge-colour: var(--colour-orange-light);
        }

        #target-ui_cargo {
            --color: var(--colour-orange);
            --bg: var(--colour-orange-dark);
            --charge-colour: var(--colour-orange-light);
        }

        #target-ui .ui-stats-grid-bar-bar {
            --gap: 3px;
        }

        /* =========================== */
        /*  OTHER STUFF                */
        /* =========================== */

        body {
            margin: 0.0;
            padding: 0.0;
            font-family: "Mulish", "Century Gothic", "CenturyGothic", "AppleGothic", sans-serif;
            color: white;
            font-size: 16px;
            font-weight: 900;
            text-shadow: 1.5px 1.5px 2px black;
            overflow: hidden;
        }

        /* Main camera: Full-screen */
        #mainCamera {
            position: absolute;
            margin: 0.0;
            padding: 0.0;
            top: 0.0;
            left: 0.0;
            width: 100vw;
            height: 100vh;
            background-color: black;
        }

        /* Canvases: Fill div, stack with z-index */
        canvas {
            position: absolute;
            top: 0.0;
            left: 0.0;
            width: 100%;
            height: 100%;
            margin: 0.0;
            padding: 0.0;
            display: block;
        }

        #mainCameraHudOutline,
        #targetCameraHudOutline {
            mix-blend-mode: multiply;
            transition: visibility 0.5s linear, opacity 0.5s ease-in-out;
            display: none;
        }

        #mainCameraHud,
        #targetCameraHud {
            mix-blend-mode: plus-lighter;
            transition: visibility 0.5s linear, opacity 0.5s ease-in-out;
            display: none;
        }

        /* Show when layered rendering is enabled (via JS class) */
        body.layered-hud-mode #mainCameraHud,
        body.layered-hud-mode #mainCameraHudOutline,
        body.layered-hud-mode #targetCameraHud,
        body.layered-hud-mode #targetCameraHudOutline {
            display: block;
        }
    </style>
</head>
